<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

<body class="bg-primary text-on-primary font-body-md min-h-screen pb-24 md:pb-0">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-primary/90 backdrop-blur-md shadow-sm">
<button class="flex items-center justify-center text-on-primary/70 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-primary">UrbanExplore</h1>
<button class="flex items-center justify-center text-on-primary/70 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content -->
<main class="pt-[80px] px-margin-mobile max-w-3xl mx-auto">
<!-- Header & Search -->
<div class="mb-lg">
<h2 class="font-headline-lg text-headline-lg text-on-primary mb-sm">Menu Manager</h2>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-primary-container">search</span>
<input class="w-full bg-primary-container/50 border border-outline/30 rounded-lg py-sm pl-10 pr-sm text-on-primary font-body-md focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" placeholder="Search menu items..." type="text"/>
</div>
</div>
<!-- Category Tabs -->
<div class="flex space-x-lg overflow-x-auto hide-scrollbar mb-xl border-b border-outline/20 pb-xs">
<button class="font-button text-button text-on-primary-container whitespace-nowrap pb-2">Appetizers</button>
<button class="font-button text-button text-secondary-fixed border-b-2 border-secondary-fixed whitespace-nowrap pb-2">Mains</button>
<button class="font-button text-button text-on-primary-container whitespace-nowrap pb-2">Grills</button>
<button class="font-button text-button text-on-primary-container whitespace-nowrap pb-2">Drinks</button>
<button class="font-button text-button text-on-primary-container whitespace-nowrap pb-2">Desserts</button>
</div>
<!-- Items List -->
<div class="space-y-sm mb-xl">
<!-- Item 1 -->
<div class="bg-primary-container/30 border border-outline/20 rounded-lg p-sm flex items-center gap-sm">
<img class="w-[48px] h-[48px] rounded object-cover flex-shrink-0" data-alt="A high-quality, professional food photograph of a rich, deep red Ethiopian Doro Wat stew. The dish features tender chicken pieces and a perfectly hard-boiled egg submerged in a complex, glistening berbere sauce. Served in a traditional dark clay bowl on a rustic wooden table. The lighting is warm and directional, emphasizing the rich textures and spices, fitting a premium restaurant menu context. The overall mood is authentic, appetizing, and rich." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBL46iHLCNeApIVcglt_kKHQ4gWeiajpwZXT17yuiZCfEHJOY9lsXNKgBmM1s1zCA9QV5RVr5LJA3Ek-UY49pgbY8IDbhGQUXtXO8sJa4xYsYCUdB45ajDAjVfMLIU_JLTwK5Lz8thN4xlkIE9qsXAiX65cf0JgeXpqQgWF4wk-1qMTIDZhrb_YYJE9FRdlWblpNXN9yL1jarHUuUBEa23MOTmGsJaJ1cO8Gz2dQ5gmyYyEEge2haxT"/>
<div class="flex-grow min-w-0">
<h3 class="font-button text-button text-on-primary truncate">Doro Wat Premium</h3>
<p class="font-body-md text-[13px] text-on-primary-container line-clamp-1">Traditional spicy chicken stew with hard-boiled egg and injera</p>
<div class="font-price-tag text-[16px] text-secondary-fixed mt-1">ETB 450</div>
</div>
<div class="flex items-center gap-sm flex-shrink-0">
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-9 h-5 bg-outline/50 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
</label>
<button class="text-on-primary-container hover:text-on-primary transition-colors">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</div>
<!-- Item 2 -->
<div class="bg-primary-container/30 border border-outline/20 rounded-lg p-sm flex items-center gap-sm opacity-60">
<div class="w-[48px] h-[48px] rounded bg-surface-variant/10 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-outline">image</span>
</div>
<div class="flex-grow min-w-0">
<h3 class="font-button text-button text-on-primary truncate">Tibs Special</h3>
<p class="font-body-md text-[13px] text-on-primary-container line-clamp-1">Sizzling marinated beef cubes with rosemary and jalapeños</p>
<div class="font-price-tag text-[16px] text-secondary-fixed mt-1">ETB 380</div>
</div>
<div class="flex items-center gap-sm flex-shrink-0">
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-9 h-5 bg-outline/50 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
</label>
<button class="text-on-primary-container hover:text-on-primary transition-colors">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</div>
</div>
<!-- Add Item Button -->
<button class="w-full py-md border-2 border-secondary-fixed/50 rounded-full font-button text-button text-secondary-fixed hover:bg-secondary-fixed/10 transition-colors flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[18px]">add</span>
            Add Item
        </button>
</main>
<!-- Bottom Nav Bar (Mobile Only) -->
<nav class="fixed bottom-0 left-0 w-full z-40 flex justify-around items-center px-4 pb-6 bg-surface/80 backdrop-blur-lg dark:bg-surface-dim/80 shadow-[0_4px_20px_rgba(0,0,0,0.06)] rounded-full mx-margin-mobile mb-4 overflow-hidden md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors w-16 h-16 rounded-full">
<span class="material-symbols-outlined">home</span>
<span class="font-label-eyebrow text-label-eyebrow mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors w-16 h-16 rounded-full">
<span class="material-symbols-outlined">restaurant</span>
<span class="font-label-eyebrow text-label-eyebrow mt-1">Eat</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary text-secondary-fixed rounded-full px-4 py-2 hover:bg-surface-container-high transition-colors Active: translate-y-[-2px] transition-all duration-150">
<span class="material-symbols-outlined">person</span>
<span class="font-label-eyebrow text-label-eyebrow mt-1">Account</span>
</button>
</nav>
<!-- Edit Modal Overlay (Hidden by default, shown for demonstration) -->
<div class="fixed inset-0 z-[100] bg-primary/80 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-margin-mobile">
<div class="bg-surface w-full max-w-md rounded-t-xl md:rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.12)] max-h-[90vh] overflow-y-auto">
<div class="sticky top-0 bg-surface/95 backdrop-blur z-10 px-md py-sm border-b border-outline/10 flex justify-between items-center">
<h3 class="font-headline-sm text-headline-sm text-on-surface">Edit Item</h3>
<button class="text-on-surface-variant hover:text-on-surface">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="p-md space-y-md">
<!-- Photo Upload Area -->
<div class="w-full h-32 border-2 border-dashed border-outline/30 rounded-lg flex flex-col items-center justify-center bg-surface-container-lowest text-on-surface-variant cursor-pointer hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[32px] mb-2">add_a_photo</span>
<span class="font-button text-button">Upload Photo</span>
</div>
<!-- Form Fields -->
<div>
<label class="block font-label-eyebrow text-label-eyebrow text-on-surface-variant uppercase mb-1">Item Name</label>
<input class="w-full bg-surface-container-lowest border-b border-outline/30 px-0 py-2 text-on-surface font-body-md focus:outline-none focus:border-secondary focus:ring-0" type="text" value="Doro Wat Premium"/>
</div>
<div class="flex gap-md">
<div class="flex-1">
<label class="block font-label-eyebrow text-label-eyebrow text-on-surface-variant uppercase mb-1">Price</label>
<div class="relative">
<span class="absolute left-0 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md">ETB</span>
<input class="w-full bg-surface-container-lowest border-b border-outline/30 pl-10 pr-0 py-2 text-on-surface font-price-tag text-price-tag focus:outline-none focus:border-secondary focus:ring-0" type="number" value="450"/>
</div>
</div>
<div class="flex-1">
<label class="block font-label-eyebrow text-label-eyebrow text-on-surface-variant uppercase mb-1">Category</label>
<select class="w-full bg-surface-container-lowest border-b border-outline/30 px-0 py-2 text-on-surface font-body-md focus:outline-none focus:border-secondary focus:ring-0 appearance-none">
<option>Mains</option>
<option>Appetizers</option>
<option>Grills</option>
</select>
</div>
</div>
<div>
<label class="block font-label-eyebrow text-label-eyebrow text-on-surface-variant uppercase mb-1">Description</label>
<textarea class="w-full bg-surface-container-lowest border-b border-outline/30 px-0 py-2 text-on-surface font-body-md focus:outline-none focus:border-secondary focus:ring-0 resize-none" rows="2">Traditional spicy chicken stew with hard-boiled egg and injera</textarea>
</div>
<div class="flex justify-between items-center py-2">
<span class="font-body-md text-on-surface">Available for Order</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-outline/30 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
</label>
</div>
</div>
<div class="p-md flex gap-sm border-t border-outline/10 bg-surface">
<button class="flex-1 py-sm rounded-full font-button text-button border border-outline text-on-surface hover:bg-surface-container-low transition-colors">Cancel</button>
<button class="flex-1 py-sm rounded-full font-button text-button bg-primary text-on-primary hover:bg-primary/90 transition-colors">Save Changes</button>
</div>
</div>
</div>
</body></html>
