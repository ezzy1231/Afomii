<!DOCTYPE html>

<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        
        .chip-checkbox:checked + label {
            background-color: theme('colors.secondary-fixed');
            color: theme('colors.on-secondary-fixed');
            border-color: theme('colors.secondary-fixed');
        }
        
        /* Custom scrollbar for horizontal lists */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- Top AppBar (Simplified for Transactional Flow - Nav Suppressed) -->
<header class="fixed top-0 w-full z-50 flex justify-center items-center px-margin-mobile h-16 bg-surface/80 backdrop-blur-md">
<h1 class="font-headline-sm text-headline-sm text-primary tracking-tight">UrbanExplore</h1>
</header>
<!-- Main Content Area -->
<main class="flex-grow pt-24 pb-32 px-margin-mobile md:px-margin-desktop flex justify-center w-full">
<div class="w-full max-w-2xl">
<!-- Stepper -->
<div class="flex justify-between items-center mb-xl relative">
<!-- Connecting Line -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-0.5 bg-surface-variant -z-10"></div>
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/2 h-0.5 bg-secondary-fixed -z-10"></div>
<!-- Step 1 -->
<div class="flex flex-col items-center gap-2 bg-background px-2">
<div class="w-8 h-8 rounded-full bg-secondary-fixed flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-secondary-fixed text-sm">check</span>
</div>
<span class="font-label-eyebrow text-label-eyebrow text-on-surface-variant uppercase">Account</span>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-2 bg-background px-2">
<div class="w-8 h-8 rounded-full bg-secondary-fixed flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-secondary-fixed text-sm">check</span>
</div>
<span class="font-label-eyebrow text-label-eyebrow text-on-surface-variant uppercase">About You</span>
</div>
<!-- Step 3 (Current) -->
<div class="flex flex-col items-center gap-2 bg-background px-2">
<div class="w-8 h-8 rounded-full bg-background border-2 border-secondary-fixed flex items-center justify-center shadow-[0_4px_20px_rgba(0,0,0,0.06)]">
<span class="font-body-md text-on-surface font-semibold">3</span>
</div>
<span class="font-label-eyebrow text-label-eyebrow text-primary uppercase">Preferences</span>
</div>
</div>
<!-- Content Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.06)] p-lg md:p-xxl">
<div class="mb-xl text-center">
<h2 class="font-headline-lg text-headline-lg text-primary mb-2">Curate your experience</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Tell us what you like so we can recommend the best spots in Addis.</p>
</div>
<form class="space-y-xl" id="preferencesForm">
<!-- Dietary Preferences Section -->
<section>
<h3 class="font-headline-sm text-headline-sm text-primary mb-md">Dietary Preferences</h3>
<div class="flex flex-wrap gap-sm">
<div class="relative">
<input class="peer sr-only chip-checkbox" id="diet-veg" type="checkbox"/>
<label class="inline-flex items-center px-4 py-2 rounded-full border border-outline-variant text-on-surface cursor-pointer hover:bg-surface-container-low transition-colors font-button text-button" for="diet-veg">
                                    Vegetarian
                                </label>
</div>
<div class="relative">
<input class="peer sr-only chip-checkbox" id="diet-vegan" type="checkbox"/>
<label class="inline-flex items-center px-4 py-2 rounded-full border border-outline-variant text-on-surface cursor-pointer hover:bg-surface-container-low transition-colors font-button text-button" for="diet-vegan">
                                    Vegan
                                </label>
</div>
<div class="relative">
<input class="peer sr-only chip-checkbox" id="diet-pesc" type="checkbox"/>
<label class="inline-flex items-center px-4 py-2 rounded-full border border-outline-variant text-on-surface cursor-pointer hover:bg-surface-container-low transition-colors font-button text-button" for="diet-pesc">
                                    Pescatarian
                                </label>
</div>
<div class="relative">
<input class="peer sr-only chip-checkbox" id="diet-keto" type="checkbox"/>
<label class="inline-flex items-center px-4 py-2 rounded-full border border-outline-variant text-on-surface cursor-pointer hover:bg-surface-container-low transition-colors font-button text-button" for="diet-keto">
                                    Keto
                                </label>
</div>
<div class="relative">
<input class="peer sr-only chip-checkbox" id="diet-halal" type="checkbox"/>
<label class="inline-flex items-center px-4 py-2 rounded-full border border-outline-variant text-on-surface cursor-pointer hover:bg-surface-container-low transition-colors font-button text-button" for="diet-halal">
                                    Halal
                                </label>
</div>
<div class="relative">
<input checked="" class="peer sr-only chip-checkbox" id="diet-orthodox" type="checkbox"/>
<label class="inline-flex items-center px-4 py-2 rounded-full border border-secondary-fixed bg-secondary-fixed text-on-secondary-fixed cursor-pointer transition-colors font-button text-button" for="diet-orthodox">
                                    Orthodox fasting
                                </label>
</div>
</div>
</section>
<hr class="border-surface-variant"/>
<!-- Allergies Section -->
<section>
<h3 class="font-headline-sm text-headline-sm text-primary mb-md">Allergies &amp; Restrictions</h3>
<div class="flex flex-wrap gap-sm">
<div class="relative">
<input checked="" class="peer sr-only chip-checkbox" id="allergy-peanuts" type="checkbox"/>
<label class="inline-flex items-center px-4 py-2 rounded-full border border-secondary-fixed bg-secondary-fixed text-on-secondary-fixed cursor-pointer transition-colors font-button text-button" for="allergy-peanuts">
                                    Peanuts
                                </label>
</div>
<div class="relative">
<input class="peer sr-only chip-checkbox" id="allergy-dairy" type="checkbox"/>
<label class="inline-flex items-center px-4 py-2 rounded-full border border-outline-variant text-on-surface cursor-pointer hover:bg-surface-container-low transition-colors font-button text-button" for="allergy-dairy">
                                    Dairy
                                </label>
</div>
<div class="relative">
<input class="peer sr-only chip-checkbox" id="allergy-gluten" type="checkbox"/>
<label class="inline-flex items-center px-4 py-2 rounded-full border border-outline-variant text-on-surface cursor-pointer hover:bg-surface-container-low transition-colors font-button text-button" for="allergy-gluten">
                                    Gluten
                                </label>
</div>
<div class="relative">
<input class="peer sr-only chip-checkbox" id="allergy-shellfish" type="checkbox"/>
<label class="inline-flex items-center px-4 py-2 rounded-full border border-outline-variant text-on-surface cursor-pointer hover:bg-surface-container-low transition-colors font-button text-button" for="allergy-shellfish">
                                    Shellfish
                                </label>
</div>
<div class="relative">
<input class="peer sr-only chip-checkbox" id="allergy-eggs" type="checkbox"/>
<label class="inline-flex items-center px-4 py-2 rounded-full border border-outline-variant text-on-surface cursor-pointer hover:bg-surface-container-low transition-colors font-button text-button" for="allergy-eggs">
                                    Eggs
                                </label>
</div>
</div>
</section>
<hr class="border-surface-variant"/>
<!-- Personal Details (Optional) -->
<section class="space-y-lg">
<h3 class="font-headline-sm text-headline-sm text-primary">Personal Details <span class="text-on-surface-variant font-body-md font-normal">(Optional)</span></h3>
<!-- Birth Date with Calendar Toggle -->
<div class="space-y-2">
<div class="flex justify-between items-end mb-2">
<label class="font-label-eyebrow text-label-eyebrow text-on-surface-variant uppercase block">Birth Date</label>
<div class="flex items-center bg-surface-container rounded-lg p-1">
<button class="px-3 py-1 text-xs font-semibold rounded bg-surface-container-lowest shadow-sm text-primary" type="button">Gregorian</button>
<button class="px-3 py-1 text-xs font-semibold rounded text-on-surface-variant hover:text-primary" type="button">Ethiopian</button>
</div>
</div>
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-lg text-primary transition-colors" type="date"/>
</div>
<!-- Gender Select -->
<div class="space-y-2">
<label class="font-label-eyebrow text-label-eyebrow text-on-surface-variant uppercase block" for="gender">Gender</label>
<select class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-lg text-primary transition-colors appearance-none" id="gender">
<option disabled="" selected="" value="">Select gender</option>
<option value="female">Female</option>
<option value="male">Male</option>
<option value="non-binary">Non-binary</option>
<option value="prefer-not">Prefer not to say</option>
</select>
</div>
</section>
</form>
</div>
</div>
</main>
<!-- Sticky Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-lowest/95 backdrop-blur-md shadow-[0_-4px_20px_rgba(0,0,0,0.05)] border-t border-surface-variant px-margin-mobile py-lg">
<div class="max-w-2xl mx-auto flex justify-between items-center">
<button class="font-button text-button text-on-surface-variant hover:text-primary transition-colors px-4 py-2" type="button">
                Back
            </button>
<button class="bg-primary text-on-primary font-button text-button px-8 py-3 rounded-full hover:opacity-90 hover:-translate-y-[2px] transition-all duration-150 shadow-md" type="button">
                Complete Setup
            </button>
</div>
</div>
</body></html>
