<body class="bg-background text-on-background antialiased pb-32">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-primary/90 backdrop-blur-md dark:bg-primary/95 shadow-sm">
<button class="flex items-center justify-center p-2 text-on-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-primary">UrbanExplore</h1>
<button class="flex items-center justify-center p-2 text-on-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-margin-mobile flex flex-col gap-xl max-w-md mx-auto">
<!-- Header & Branch Selector -->
<section class="flex flex-col gap-md">
<div>
<h2 class="font-headline-sm text-headline-sm text-primary mb-xs">Booking Settings</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Configure availability and rules.</p>
</div>
<div class="flex gap-sm overflow-x-auto snap-x hide-scrollbar pb-2">
<button class="snap-start shrink-0 px-4 py-2 rounded-full border border-secondary text-secondary font-button text-button bg-secondary/10">Bole</button>
<button class="snap-start shrink-0 px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-button text-button hover:bg-surface-container transition-colors">Kazanchis</button>
<button class="snap-start shrink-0 px-4 py-2 rounded-full border border-dashed border-outline-variant text-on-surface-variant font-button text-button flex items-center gap-1 hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-sm">add</span> Add
                </button>
</div>
</section>
<!-- Booking Mode Card -->
<section class="bg-surface-container-lowest rounded-xl p-md shadow-[0_4px_20px_rgba(0,0,0,0.06)] flex flex-col gap-lg border border-surface-container">
<h3 class="font-label-eyebrow text-label-eyebrow text-on-surface uppercase">1. Booking Mode</h3>
<div class="grid grid-cols-1 gap-sm">
<!-- Mode Option -->
<label class="flex items-start p-sm rounded-lg border border-outline-variant cursor-pointer hover:bg-surface-container transition-colors">
<input class="mt-1 text-primary focus:ring-primary border-outline-variant" name="booking_mode" type="radio"/>
<div class="ml-3 flex flex-col">
<span class="font-body-md text-body-md font-semibold text-on-surface">Walk-in Only</span>
<span class="font-body-md text-body-md text-sm text-on-surface-variant">No reservations accepted.</span>
</div>
</label>
<!-- Active Mode Option -->
<label class="flex items-start p-sm rounded-lg border-2 border-secondary bg-secondary/5 cursor-pointer relative overflow-hidden">
<div class="absolute top-0 right-0 p-1 bg-secondary rounded-bl-lg">
<span class="material-symbols-outlined text-on-secondary text-xs" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<input checked="" class="mt-1 text-secondary focus:ring-secondary border-secondary" name="booking_mode" type="radio"/>
<div class="ml-3 flex flex-col">
<span class="font-body-md text-body-md font-semibold text-on-surface">Time Slots</span>
<span class="font-body-md text-body-md text-sm text-on-surface-variant">Guests book specific times.</span>
</div>
</label>
<!-- Mode Option -->
<label class="flex items-start p-sm rounded-lg border border-outline-variant cursor-pointer hover:bg-surface-container transition-colors">
<input class="mt-1 text-primary focus:ring-primary border-outline-variant" name="booking_mode" type="radio"/>
<div class="ml-3 flex flex-col">
<span class="font-body-md text-body-md font-semibold text-on-surface">Request Mode</span>
<span class="font-body-md text-body-md text-sm text-on-surface-variant">Manual approval required.</span>
</div>
</label>
</div>
</section>
<!-- Capacity Card -->
<section class="bg-surface-container-lowest rounded-xl p-md shadow-[0_4px_20px_rgba(0,0,0,0.06)] flex flex-col gap-lg border border-surface-container">
<h3 class="font-label-eyebrow text-label-eyebrow text-on-surface uppercase">2. Capacity</h3>
<div class="flex flex-col gap-md">
<div class="flex justify-between items-center">
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface">Total Tables</span>
</div>
<div class="flex items-center gap-3 bg-surface-container rounded-full p-1">
<button class="w-8 h-8 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center text-on-surface hover:bg-surface-variant active:scale-95 transition-all"><span class="material-symbols-outlined">remove</span></button>
<span class="font-body-lg text-body-lg font-semibold w-6 text-center">12</span>
<button class="w-8 h-8 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center text-on-surface hover:bg-surface-variant active:scale-95 transition-all"><span class="material-symbols-outlined">add</span></button>
</div>
</div>
<div class="h-px bg-surface-variant w-full"></div>
<div class="flex justify-between items-center">
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface">Max Guests / Table</span>
</div>
<div class="flex items-center gap-3 bg-surface-container rounded-full p-1">
<button class="w-8 h-8 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center text-on-surface hover:bg-surface-variant active:scale-95 transition-all"><span class="material-symbols-outlined">remove</span></button>
<span class="font-body-lg text-body-lg font-semibold w-6 text-center">8</span>
<button class="w-8 h-8 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center text-on-surface hover:bg-surface-variant active:scale-95 transition-all"><span class="material-symbols-outlined">add</span></button>
</div>
</div>
</div>
</section>
<!-- Policy Card -->
<section class="bg-surface-container-lowest rounded-xl p-md shadow-[0_4px_20px_rgba(0,0,0,0.06)] flex flex-col gap-lg border border-surface-container">
<h3 class="font-label-eyebrow text-label-eyebrow text-on-surface uppercase">3. Policy</h3>
<div class="flex flex-col gap-md">
<div class="flex flex-col gap-2">
<label class="font-label-eyebrow text-label-eyebrow text-on-surface-variant uppercase">Slot Duration</label>
<select class="w-full rounded-md border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-primary focus:border-primary shadow-sm py-2 px-3">
<option>30 min</option>
<option selected="">60 min</option>
<option>90 min</option>
<option>120 min</option>
</select>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-eyebrow text-label-eyebrow text-on-surface-variant uppercase">Advance Notice (Hours)</label>
<input class="w-full rounded-md border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-primary focus:border-primary shadow-sm py-2 px-3" type="number" value="2"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-eyebrow text-label-eyebrow text-on-surface-variant uppercase">Cancellation Policy</label>
<textarea class="w-full rounded-md border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-primary focus:border-primary shadow-sm py-2 px-3 resize-none" placeholder="Enter terms..." rows="3"></textarea>
</div>
</div>
</section>
<!-- Live Preview Strip -->
<section class="bg-primary-container text-on-primary-container rounded-lg p-sm text-sm flex items-center gap-3">
<span class="material-symbols-outlined text-secondary">visibility</span>
<span class="font-body-md text-body-md text-sm leading-tight">
<strong>Guests see:</strong> Instant confirmation · up to 8 guests · free cancellation 2h
            </span>
</section>
</main>
<!-- Sticky Bottom Save Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/90 backdrop-blur-lg border-t border-surface-variant p-4 z-40 pb-6 flex justify-between items-center px-margin-mobile shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
<span class="font-body-md text-body-md text-sm text-on-surface-variant italic">Unsaved changes</span>
<div class="flex gap-3">
<button class="px-4 py-2 rounded-full font-button text-button text-on-surface-variant hover:bg-surface-container transition-colors">Discard</button>
<button class="px-6 py-2 rounded-full bg-secondary text-on-secondary font-button text-button hover:opacity-90 active:scale-95 transition-all shadow-md">Save</button>
</div>
</div>

        /* Utility for hiding scrollbar in horizontal scroll areas */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

            -ms-overflow-style: none;
            scrollbar-width: none;
        }
