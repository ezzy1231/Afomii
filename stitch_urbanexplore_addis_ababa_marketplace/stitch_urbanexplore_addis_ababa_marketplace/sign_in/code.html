<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In - UrbanExplore</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#0b0500",
                        "on-tertiary-fixed-variant": "#5d4215",
                        "on-surface-variant": "#44474d",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#fcdfab",
                        "on-tertiary-fixed": "#291800",
                        "surface-dim": "#dcd9d8",
                        "inverse-on-surface": "#f3f0ef",
                        "primary": "#000615",
                        "secondary": "#705b32",
                        "tertiary-fixed-dim": "#e8c088",
                        "inverse-surface": "#303030",
                        "outline-variant": "#c4c6ce",
                        "surface-container-high": "#eae7e7",
                        "on-secondary-fixed-variant": "#57441d",
                        "on-primary-fixed-variant": "#364764",
                        "surface-variant": "#e4e2e1",
                        "surface-container": "#f0edec",
                        "surface-container-low": "#f6f3f2",
                        "primary-fixed-dim": "#b5c7ea",
                        "on-secondary-fixed": "#261900",
                        "primary-fixed": "#d6e3ff",
                        "error-container": "#ffdad6",
                        "background": "#fcf9f8",
                        "secondary-container": "#f9dca8",
                        "outline": "#75777e",
                        "on-secondary-container": "#756036",
                        "on-surface": "#1b1c1b",
                        "secondary-fixed-dim": "#dfc391",
                        "tertiary-fixed": "#ffddb1",
                        "surface": "#fcf9f8",
                        "surface-tint": "#4d5f7d",
                        "on-primary-fixed": "#071c36",
                        "surface-container-highest": "#e4e2e1",
                        "tertiary-container": "#2d1b00",
                        "on-primary-container": "#7587a7",
                        "on-tertiary-container": "#a3814e",
                        "inverse-primary": "#b5c7ea",
                        "surface-bright": "#fcf9f8",
                        "on-primary": "#ffffff",
                        "on-background": "#1b1c1b",
                        "on-error-container": "#93000a",
                        "primary-container": "#0b1f3a",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "64px",
                        "gutter": "16px",
                        "xl": "32px",
                        "base": "4px",
                        "xs": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xxl": "48px",
                        "sm": "12px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Playfair Display"],
                        "display-lg": ["Playfair Display"],
                        "button": ["Inter"],
                        "price-tag": ["Playfair Display"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Playfair Display"],
                        "label-eyebrow": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "button": ["14px", { "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "price-tag": ["20px", { "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-sm": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "label-eyebrow": ["11px", { "lineHeight": "16px", "letterSpacing": "0.15em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .input-float:focus-within label,
        .input-float input:not(:placeholder-shown) + label {
            transform: translateY(-50%) scale(0.8);
            color: theme('colors.secondary');
        }
        .input-float input:focus {
            border-color: theme('colors.secondary');
            box-shadow: 0 1px 0 0 theme('colors.secondary');
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-body-md">
<!-- Standard Sign In State -->
<div class="w-full max-w-sm bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.06)] p-lg md:p-xl flex flex-col gap-lg mb-xxl">
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs">Welcome back</h1>
<p class="text-on-surface-variant">Sign in to curate your experience.</p>
</div>
<form class="flex flex-col gap-md">
<div class="relative input-float pt-sm">
<input class="peer block w-full border-0 border-b border-outline-variant bg-transparent py-xs px-0 text-on-surface focus:ring-0 appearance-none focus:outline-none transition-colors" id="email" placeholder=" " type="email"/>
<label class="absolute left-0 top-1/2 -translate-y-1/2 text-on-surface-variant cursor-text transition-all duration-200 ease-out origin-[0] font-label-eyebrow text-label-eyebrow uppercase" for="email">Email Address</label>
</div>
<div class="relative input-float pt-sm">
<input class="peer block w-full border-0 border-b border-outline-variant bg-transparent py-xs px-0 text-on-surface focus:ring-0 appearance-none focus:outline-none transition-colors" id="password" placeholder=" " type="password"/>
<label class="absolute left-0 top-1/2 -translate-y-1/2 text-on-surface-variant cursor-text transition-all duration-200 ease-out origin-[0] font-label-eyebrow text-label-eyebrow uppercase" for="password">Password</label>
</div>
<div class="flex justify-end mt-xs">
<a class="font-button text-button text-primary hover:text-secondary transition-colors" href="#">Forgot password?</a>
</div>
<button class="w-full bg-primary text-on-primary rounded-full py-sm font-button text-button hover:translate-y-[-2px] hover:shadow-lg transition-all duration-150 mt-sm" type="button">Sign in</button>
</form>
<div class="relative flex items-center py-xs">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 px-md text-on-surface-variant font-label-eyebrow text-label-eyebrow uppercase">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<button class="w-full border border-secondary text-secondary rounded-full py-sm font-button text-button flex items-center justify-center gap-xs hover:bg-surface-container-low hover:translate-y-[-2px] transition-all duration-150" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Sign in with Google
        </button>
<div class="text-center mt-xs">
<a class="font-button text-button text-on-surface-variant hover:text-primary transition-colors" href="#">New here? Choose your role</a>
</div>
</div>
<!-- Error State Variant (Hidden visually via layout, just for demonstration as requested) -->
<div class="w-full max-w-sm bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.06)] p-lg md:p-xl flex flex-col gap-lg opacity-50 filter grayscale pointer-events-none">
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs">Welcome back</h1>
<p class="text-on-surface-variant">Sign in to curate your experience.</p>
</div>
<!-- Error Banner -->
<div class="bg-error-container text-on-error-container p-sm rounded-lg flex items-center gap-xs text-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">error</span>
<span>Invalid email or password</span>
</div>
<form class="flex flex-col gap-md">
<div class="relative input-float pt-sm">
<input class="peer block w-full border-0 border-b border-error text-error bg-transparent py-xs px-0 focus:ring-0 appearance-none focus:outline-none transition-colors" id="email-err" placeholder=" " type="email" value="user@example.com"/>
<label class="absolute left-0 top-0 -translate-y-1/2 scale-80 text-error cursor-text transition-all duration-200 ease-out origin-[0] font-label-eyebrow text-label-eyebrow uppercase" for="email-err">Email Address</label>
</div>
<div class="relative input-float pt-sm">
<input class="peer block w-full border-0 border-b border-error text-error bg-transparent py-xs px-0 focus:ring-0 appearance-none focus:outline-none transition-colors" id="password-err" placeholder=" " type="password" value="wrongpassword"/>
<label class="absolute left-0 top-0 -translate-y-1/2 scale-80 text-error cursor-text transition-all duration-200 ease-out origin-[0] font-label-eyebrow text-label-eyebrow uppercase" for="password-err">Password</label>
</div>
<button class="w-full bg-primary text-on-primary rounded-full py-sm font-button text-button hover:translate-y-[-2px] hover:shadow-lg transition-all duration-150 mt-sm" type="button">Sign in</button>
</form>
</div>
</body></html>
