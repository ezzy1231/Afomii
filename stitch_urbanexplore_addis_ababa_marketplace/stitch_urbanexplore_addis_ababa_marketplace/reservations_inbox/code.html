<style>
        /* Swipe to reveal styles */
        .swipe-item {
            position: relative;
            overflow: hidden;
        }
        .swipe-content {
            position: relative;
            z-index: 10;
            background-color: #1a1a1a; /* Darker surface for rows */
            transition: transform 0.3s ease-out;
        }
        .swipe-actions {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            display: flex;
            z-index: 1;
        }
        .swipe-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
        }
        .action-reject { background-color: #ba1a1a; }
        .action-confirm { background-color: #705b32; }

</div>
