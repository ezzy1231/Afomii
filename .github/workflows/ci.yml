name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Web lint + typecheck + build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/web
      - name: Lint
        run: npm run lint
        working-directory: apps/web
      - name: Build (smoke)
        # Full `next build` compiles every route, runs its own lint/type pass,
        # and catches metadata/sitemap/manifest wiring mistakes at build time.
        # Skip pages that strictly need a live Supabase project — not required
        # for static prerender of the public catalogue.
        run: npm run build
        working-directory: apps/web
        env:
          # typecheck already ran; next build re-runs it — keep it on to
          # surface route-level type errors only build sees.
          NEXT_TELEMETRY_DISABLED: 1

  web-tests:
    name: Web unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
        working-directory: apps/web

  web-e2e:
    name: Web E2E smoke (Playwright)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Build production server
        run: npm run build
        working-directory: apps/web
      - name: Run E2E (config auto-starts the server)
        run: npx playwright test
        working-directory: apps/web

  mobile:
    name: Mobile typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/mobile
      - name: Unit tests
        run: npm test --workspace=@urbanexplore/mobile --if-present

  backend:
    name: Backend lint + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: foodride
          POSTGRES_PASSWORD: foodride_dev
          POSTGRES_DB: foodride
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foodride"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://foodride:foodride_dev@localhost:5432/foodride?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint --workspace=@urbanexplore/backend
      - name: Test
        run: npm test --workspace=@urbanexplore/backend --if-present
